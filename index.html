<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Diabetes Prediction App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; padding-top: 50px; }
        .card { border-radius: 15px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card p-5">
                <h2 class="text-center mb-4">Diabetes Predictive System</h2>
                <form action="/predict" method="post">
                    <div class="row g-3">
                        <!-- Inputs based on columns in copy_of_welcome_to_colab.py[cite: 1] -->
                        <div class="col-md-6"><input type="number" step="any" name="Pregnancies" class="form-control" placeholder="Pregnancies" required></div>
                        <div class="col-md-6"><input type="number" step="any" name="Glucose" class="form-control" placeholder="Glucose" required></div>
                        <div class="col-md-6"><input type="number" step="any" name="BloodPressure" class="form-control" placeholder="Blood Pressure" required></div>
                        <div class="col-md-6"><input type="number" step="any" name="SkinThickness" class="form-control" placeholder="Skin Thickness" required></div>
                        <div class="col-md-6"><input type="number" step="any" name="Insulin" class="form-control" placeholder="Insulin" required></div>
                        <div class="col-md-6"><input type="number" step="any" name="BMI" class="form-control" placeholder="BMI" required></div>
                        <div class="col-md-6"><input type="number" step="any" name="DiabetesPedigreeFunction" class="form-control" placeholder="Pedigree Function" required></div>
                        <div class="col-md-6"><input type="number" step="any" name="Age" class="form-control" placeholder="Age" required></div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mt-4">Predict Results</button>
                </form>

                {% if prediction_text %}
                <div class="alert alert-{{res_class}} mt-4 text-center">
                    <h3>{{ prediction_text }}</h3>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
</body>
</html>
